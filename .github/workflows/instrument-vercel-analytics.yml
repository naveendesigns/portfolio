name: Instrument Vercel Analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  instrument:
    if: ${{ !contains(github.event.head_commit.message, 'apply Vercel Analytics instrumentation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Vercel Analytics to every HTML page
        shell: python
        run: |
          from pathlib import Path

          snippet = '''    <script>\n      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };\n    </script>\n    <script defer src="/_vercel/insights/script.js"></script>'''

          changed = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if '/_vercel/insights/script.js' in text:
                  continue
              marker = '</body>'
              if marker not in text.lower():
                  continue
              idx = text.lower().rfind(marker)
              text = text[:idx] + snippet + '\n' + text[idx:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Instrumented pages:')
          for item in changed:
              print(f'- {item}')

          if not changed:
              raise SystemExit('No HTML pages needed instrumentation.')

      - name: Commit instrumentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply Vercel Analytics instrumentation"
          git push
